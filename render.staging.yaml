# Independent staging resources only. Never point these at the production database.
services:
  - type: web
    name: creo-smart-matching-staging
    runtime: python
    plan: free
    branch: feature/smart-matching-2
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.lock.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/render_start.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: creo-smart-matching-staging-db
          property: connectionString
      - key: DATABASE_MEDIA
        value: 'True'
      - key: SEED_DEMO
        value: 'True'
      - key: TRUSTED_PROXY_IP
        value: '*'
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: 'False'
databases:
  - name: creo-smart-matching-staging-db
    plan: free
    databaseName: creo_staging
    user: creo_staging
    ipAllowList: []
