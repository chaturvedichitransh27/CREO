# Disposable staging only. SQLite data resets when Render replaces the instance.
# This avoids the workspace's one-free-Postgres limit; CI also tests PostgreSQL.
# Never point this service at the production database.
services:
  - type: web
    name: creo-smart-matching-staging
    runtime: python
    plan: free
    branch: feature/smart-matching-2
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.lock.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/render_start.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/creo-smart-matching-staging.sqlite3
      - key: DATABASE_MEDIA
        value: 'True'
      - key: SEED_DEMO
        value: 'True'
      - key: TRUSTED_PROXY_IP
        value: '*'
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: 'False'
